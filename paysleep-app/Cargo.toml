[package]
name = "paysleep-app"
description = "Paysleep server composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
actix-web.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
paysleep-application = { path = "../paysleep-application" }
paysleep-storage-filesystem = { path = "../paysleep-storage-filesystem" }
paysleep-storage-google-drive = { path = "../paysleep-storage-google-drive" }
paysleep-storage-proton-drive = { path = "../paysleep-storage-proton-drive" }
paysleep-web = { path = "../paysleep-web" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
async-trait.workspace = true
paysleep-core = { path = "../paysleep-core" }
uuid = { workspace = true, features = ["v4"] }
